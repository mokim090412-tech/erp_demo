<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(가상) 한빛상사 인사·총무 교육용 앱</title>
<style>
/* =====================================================================
   디자인 토큰 — design.md(Clay.com 디자인 시스템)를 이 앱에 맞게 잘라 씀
   ---------------------------------------------------------------------
   가져온 것 : 크림 캔버스, 6색 브랜드 팔레트, 4px 여백 스케일,
               라운드 스케일(6/8/12/16/24), 44px 터치 영역, 반응형 중단점
   뺀 것     : 3D 클레이메이션 일러스트, 히어로/가격표/후기 카드 (우리 앱에 없는 화면)
   바꾼 것   : ① 본문 16px → 14px, 표 13px (22칸 급여대장이 터지지 않게)
               ② 경고 배너를 오커 채움으로 강화 (크림 배경에 묻히면 안 되는 필수 표시)
               ③ 피처 카드 색을 "순환"이 아니라 "고정 의미"로 매핑 (admin 도구라 색이 뜻을 가져야 함)
   못 쓴 것  : Plain Black 서체(Clay 전용 라이선스) · Inter(한글 글자 없음)
               → Malgun Gothic 유지 + 제목에 음수 자간만 적용
   ===================================================================== */
:root{
  /* 표면 */
  --canvas:#fffaf0; --surface-soft:#faf5e8; --surface-card:#f5f0e0; --surface-strong:#ebe6d6;
  --surface-dark:#0a1a1a; --surface-dark-2:#1a2a2a; --hairline:#e5e5e5;
  /* 글자 */
  --ink:#0a0a0a; --body-strong:#1a1a1a; --body:#3a3a3a; --muted:#6a6a6a; --muted-soft:#9a9a9a;
  --primary:#0a0a0a; --on-primary:#ffffff;
  /* 브랜드 6색 */
  --brand-pink:#ff4d8b; --brand-teal:#1a3a3a; --brand-lavender:#b8a4ed;
  --brand-peach:#ffb084; --brand-ochre:#e8b94a; --brand-mint:#a4d4c5; --brand-coral:#ff6b5a;
  /* 시맨틱 */
  --success:#22c55e; --warning:#f59e0b; --error:#ef4444;
  /* 상태 배지 */
  --ok-bg:#e3f5ea;  --ok-fg:#166534;
  --bad-bg:#fdeae8; --bad-fg:#b42318;
  --wait-bg:#efe9fb;--wait-fg:#5b3fa8;
  --off-bg:#efece2; --off-fg:#5a5a5a;
  --plan-bg:#e8f2ef;--plan-fg:#1a3a3a;
  /* 여백 (4px 기준) */
  --sp-xxs:4px; --sp-xs:8px; --sp-sm:12px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-xxl:48px;
  /* 라운드 */
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-pill:9999px;
  /* 별칭 (기존 코드 호환) */
  --brand:var(--brand-teal); --line:var(--hairline); --panel:var(--canvas);
  --mono:"Consolas","D2Coding",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--body);
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.55}

/* ===== 교육용 가상 자료 경고 배너 — 모든 화면 고정 =====
   크림 캔버스와 옅은 노랑은 거의 같은 색이라 묻힌다.
   이 표시는 프로젝트 1번 요구사항이므로 오커 채움으로 확실히 분리한다. */
#eduBanner{position:sticky;top:0;z-index:100;background:var(--brand-ochre);border-bottom:2px solid #c9a032;
  color:var(--ink);padding:var(--sp-xs) var(--sp-md);font-weight:700;font-size:13px;
  display:flex;gap:var(--sp-sm);align-items:center;flex-wrap:wrap}
#eduBanner .tag{background:var(--ink);color:var(--brand-ochre);border-radius:var(--r-pill);
  padding:3px 10px;font-size:11px;letter-spacing:.5px}
#eduBanner .sub{font-weight:400;color:#5c4708}

#wrap{display:flex;min-height:calc(100vh - 40px)}

/* ===== 사이드바 ===== */
#side{width:212px;flex:none;background:var(--surface-dark);color:#c2ccc8;padding:var(--sp-md) 0 var(--sp-xxl)}
#side .brand{padding:0 var(--sp-md) var(--sp-md);border-bottom:1px solid #243434;margin-bottom:var(--sp-sm)}
#side .brand b{display:block;color:#fff;font-size:16px;letter-spacing:-.4px}
#side .brand span{font-size:11px;color:#7e908b}
#side .grp{padding:var(--sp-sm) var(--sp-md) var(--sp-xxs);font-size:12px;font-weight:600;color:#7e908b;letter-spacing:1.5px}
#side a{display:block;padding:var(--sp-xs) var(--sp-md);color:#c2ccc8;text-decoration:none;cursor:pointer;
  border-left:3px solid transparent;font-size:14px}
#side a:hover{background:var(--surface-dark-2)}
#side a.on{background:var(--surface-dark-2);color:#fff;border-left-color:var(--brand-mint);font-weight:700}
#side .foot{margin-top:var(--sp-lg);padding:0 var(--sp-md)}
#side .foot button{width:100%;height:40px;background:transparent;color:#c2ccc8;border:1px solid #35494a;
  border-radius:var(--r-md);cursor:pointer;font-size:13px;font-weight:600}
#side .foot button:hover{background:var(--surface-dark-2);filter:none}

/* ===== 본문 ===== */
#main{flex:1;max-width:1280px;margin:0 auto;padding:var(--sp-lg) var(--sp-lg) var(--sp-xxl);min-width:0}
h1{font-size:28px;font-weight:600;letter-spacing:-.6px;color:var(--ink);
  margin:0 0 var(--sp-xxs);display:flex;align-items:center;gap:var(--sp-sm);flex-wrap:wrap}
.badge-v{background:var(--brand-ochre);color:var(--ink);border-radius:var(--r-pill);
  font-size:12px;padding:3px 10px;font-weight:700;letter-spacing:0}
.desc{color:var(--muted);margin:0 0 var(--sp-lg);font-size:14px}

.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);
  padding:var(--sp-lg);margin-bottom:var(--sp-md)}
.card > h3{margin:0 0 var(--sp-sm);font-size:16px;font-weight:600;letter-spacing:-.2px;color:var(--ink)}
.row{display:flex;gap:var(--sp-md);flex-wrap:wrap}
.row > .card{flex:1;min-width:240px}

/* ===== KPI — design.md의 "피처 카드"를 쓰는 유일한 자리 ===== */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:var(--sp-md);margin-bottom:var(--sp-lg)}
.kpi .box{background:var(--surface-card);border-radius:var(--r-xl);padding:var(--sp-lg);border:1px solid transparent}
.kpi .box .lbl{font-size:13px;font-weight:600;opacity:.75}
.kpi .box .val{font-size:26px;font-weight:700;letter-spacing:-.8px;margin-top:var(--sp-xxs);white-space:nowrap}
.kpi .box .sub{font-size:12px;opacity:.7;margin-top:2px}
.kpi .box.t-lavender{background:var(--brand-lavender);color:var(--ink)}
.kpi .box.t-peach{background:var(--brand-peach);color:var(--ink)}
.kpi .box.t-ochre{background:var(--brand-ochre);color:var(--ink)}
.kpi .box.t-teal{background:var(--brand-teal);color:var(--on-primary)}
.kpi .box.t-coral{background:var(--brand-coral);color:var(--on-primary)}
.kpi .box.t-mint{background:var(--brand-mint);color:var(--ink)}
/* 문제 상태 — 6색 위에서도 보이도록 잉크 링을 쓴다 (빨강은 coral/peach 위에서 안 보임) */
.kpi .box.alert{box-shadow:0 0 0 2px var(--ink)}
/* 대시보드는 KPI가 정확히 6개 — design.md의 "피처 카드 3-up" 규칙대로 3열 2행 */
.kpi.k3{grid-template-columns:repeat(3,1fr)}

/* ===== 표 ===== */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--hairline);padding:10px var(--sp-sm);text-align:left;white-space:nowrap}
th{background:var(--surface-card);color:var(--body-strong);font-weight:600;font-size:12px}
td{color:var(--body)}
tbody tr:hover{background:var(--surface-soft)}
td.num,th.num{text-align:right;font-family:var(--mono)}
.scroll{max-height:560px;overflow:auto;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--canvas)}
.scroll table th{position:sticky;top:0;z-index:2}

/* ===== 버튼 · 입력 (터치 영역 44px) ===== */
button,.btn{background:var(--primary);color:var(--on-primary);border:0;border-radius:var(--r-md);
  height:44px;padding:0 20px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
button:hover{filter:brightness(1.35)}
button.ghost{background:var(--canvas);color:var(--ink);border:1px solid var(--hairline)}
button.ghost:hover{background:var(--surface-card);filter:none}
button.mini{height:32px;padding:0 12px;font-size:13px;border-radius:var(--r-sm)}
button.danger{background:var(--error)}
input,select,textarea{border:1px solid var(--hairline);border-radius:var(--r-md);height:44px;
  padding:0 var(--sp-md);font-size:14px;font-family:inherit;background:var(--canvas);color:var(--ink)}
textarea{height:auto;padding:var(--sp-sm) var(--sp-md)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ink)}
label.f{display:inline-flex;flex-direction:column;gap:var(--sp-xxs);font-size:13px;color:var(--muted);
  margin:0 var(--sp-sm) var(--sp-sm) 0}
.toolbar{display:flex;gap:var(--sp-sm);align-items:flex-end;flex-wrap:wrap;margin-bottom:var(--sp-md)}

/* ===== 배지 ===== */
.pill{border-radius:var(--r-pill);padding:3px 10px;font-size:12px;font-weight:600;display:inline-block}
.p-ok{background:var(--ok-bg);color:var(--ok-fg)}
.p-bad{background:var(--bad-bg);color:var(--bad-fg)}
.p-wait{background:var(--wait-bg);color:var(--wait-fg)}
.p-off{background:var(--off-bg);color:var(--off-fg)}
.p-plan{background:var(--plan-bg);color:var(--plan-fg);border:1px dashed var(--brand-teal)}

/* ===== 안내 · 경고 상자 ===== */
.note{background:var(--surface-card);border-left:3px solid var(--brand-teal);
  padding:var(--sp-sm) var(--sp-md);border-radius:0 var(--r-md) var(--r-md) 0;font-size:13px;margin-bottom:var(--sp-md)}
.warnbox{background:#fff1e6;border:1px solid var(--brand-peach);color:#6b3b12;
  padding:var(--sp-sm) var(--sp-md);border-radius:var(--r-md);font-size:13px;margin-bottom:var(--sp-md)}
.warnbox b{color:#8a3d00}

/* ===== 조직도 ===== */
.tree ul{list-style:none;margin:0;padding-left:var(--sp-lg);border-left:1px dashed #d6d0bf}
.tree > ul{padding-left:0;border:0}
.tree li{margin:var(--sp-xxs) 0}
.tree .n-hq{font-weight:700;color:var(--brand-teal)}
.tree .n-team{font-weight:700;color:var(--ink)}
.tree .cnt{color:var(--muted);font-size:12px;font-weight:400}
.tree .mem{color:var(--body);font-size:13px}

/* ===== 회의실 달력 ===== */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--sp-xs)}
.calgrid .d{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-sm);
  min-height:72px;padding:var(--sp-xs);font-size:12px}
.calgrid .d.hd{min-height:0;background:var(--surface-card);text-align:center;font-weight:600;color:var(--body-strong)}
.calgrid .d.off{background:var(--surface-soft);color:var(--muted-soft)}
.calgrid .d .dn{font-weight:700;font-size:13px;color:var(--ink)}
.calgrid .d .ev{background:var(--surface-strong);color:var(--brand-teal);border-radius:var(--r-xs);
  padding:1px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;font-weight:600}

/* ===== 실습 과제 ===== */
.task{border:1px solid var(--hairline);border-radius:var(--r-lg);padding:var(--sp-md) var(--sp-lg);
  margin-bottom:var(--sp-sm);background:var(--canvas)}
.task.done{border-color:var(--brand-mint);background:#f2faf6}
.task h4{margin:0 0 var(--sp-xxs);font-size:15px;font-weight:600;color:var(--ink)}
.task .q{color:var(--body);font-size:14px;margin-bottom:var(--sp-sm)}
.task .res{font-size:13px;margin-top:var(--sp-xs)}

/* ===== 급여명세서 ===== */
.payslip{max-width:680px;border:2px solid var(--ink);border-radius:var(--r-lg);padding:var(--sp-lg);
  background:var(--canvas);position:relative;overflow:hidden}
.payslip .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:900;color:rgba(232,185,74,.28);transform:rotate(-22deg);pointer-events:none;letter-spacing:6px}
.payslip h2{text-align:center;margin:0 0 var(--sp-xxs);font-size:20px;letter-spacing:-.4px;color:var(--ink)}
.payslip .meta{text-align:center;color:var(--muted);font-size:12px;margin-bottom:var(--sp-md)}
.payslip table{font-size:13px}
.payslip .tot{font-size:18px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}

/* ===== 모달 ===== */
.modal{position:fixed;inset:0;background:rgba(10,26,26,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal .inner{background:var(--canvas);border-radius:var(--r-lg);padding:var(--sp-lg);
  max-width:660px;width:92%;max-height:86vh;overflow:auto}
.modal h3{margin:0 0 var(--sp-sm);font-size:20px;font-weight:600;letter-spacing:-.4px;color:var(--ink)}
.hide{display:none!important}
.right{text-align:right}
small.m{color:var(--muted)}
a{color:var(--brand-teal)}

/* ===== 반응형 ===== */
@media (max-width:1024px){
  .kpi{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
  .kpi.k3{grid-template-columns:repeat(2,1fr)}
  #main{padding:var(--sp-md) var(--sp-md) var(--sp-xxl)}
}
@media (max-width:768px){
  #wrap{flex-direction:column}
  #side{width:100%;padding:var(--sp-xs) 0 var(--sp-sm)}
  #side .brand{border-bottom:0;padding-bottom:var(--sp-xs);margin-bottom:var(--sp-xxs)}
  #side .grp{display:inline-block;padding:var(--sp-xs) var(--sp-xs) 0 var(--sp-md)}
  #side a{display:inline-block;padding:var(--sp-xs) var(--sp-sm);border-left:0;border-bottom:3px solid transparent}
  #side a.on{border-left:0;border-bottom-color:var(--brand-mint)}
  #side .foot{margin-top:var(--sp-sm)}
  h1{font-size:22px}
  .kpi{grid-template-columns:1fr 1fr}
}

@media print{
  #side,#eduBanner,.toolbar,button{display:none!important}
  body{background:#fff}
  #main{padding:0;max-width:none}
  .payslip{border:1px solid #000}
  body::before{content:"교육용 가상 자료 - 실제 인사정보 아님";display:block;
    text-align:center;font-weight:700;color:#b45309;border:2px solid #b45309;padding:6px;margin-bottom:10px}
}
</style>
</head>

<div id="eduBanner">
  <span class="tag">교육용</span>
  <span>본 화면의 모든 자료는 교육을 위해 만든 <b>가상 자료</b>입니다. 실제 인사·급여 정보가 아닙니다.</span>
  <span class="sub">· (가상) 한빛상사(주) · 기준일 2026-09-14</span>
</div>

<div id="wrap">
  <nav id="side">
    <div class="brand"><b>(가상) 한빛상사</b><span>인사·총무 교육용 앱 v1.0</span></div>
    <div class="grp">인사 기본</div>
    <a data-v="dash">대시보드</a>

  <main id="main"></main>
</div>

<div id="modalHost"></div>

<script>
/* =====================================================================
   (가상) 한빛상사 인사·총무 교육용 앱
   ---------------------------------------------------------------------
   ※ 이 파일의 모든 데이터는 교육 목적으로 처음부터 만들어낸 가상 자료입니다.
      실존하는 회사·인물·급여·계약과 아무 관련이 없습니다.
      주민등록번호·계좌번호 등 민감 식별정보는 가상으로도 만들지 않습니다.
   ===================================================================== */

const TODAY = '2026-09-14';          // 앱의 "오늘" (고정)
const COMPANY = '(가상) 한빛상사 주식회사';
const STORE_KEY = 'hanbit_edu_hr_v2';   // v2: 휴직사유 필드 추가 → 옛 저장 데이터는 버림

/* ---------- 조직 ---------- */
const ORG = [
  { hq:'경영지원본부', teams:['경영지원팀'] },
  { hq:'사업본부',     teams:['영업팀','물류팀'] },
];
const TEAM2HQ = {};
ORG.forEach(o => o.teams.forEach(t => TEAM2HQ[t] = o.hq));

const GRADES = ['사원','주임','대리','과장','차장','부장','이사'];

/* ---------- 가상 사원 마스터 (10명: 재직 8 / 휴직 1 / 퇴사 1) ----------
   [사번숫자, 이름, 팀, 직급, 입사일, 직책, 재직상태, 퇴사일, 공제대상가족수, 8~20세 자녀수, 휴직사유]
   ※ 공제대상가족수는 본인·배우자를 각각 1명으로 셈 (소득세법 시행령 별표2 비고 2)
      근로소득 간이세액표 조회에 쓰이는 값이며, 여기 값은 모두 가상입니다.              */
const EMP_SEED = [
  [1,'한도경','경영지원팀','이사','2013-03-02','본부장','재직','',4,2],
  [2,'서지환','경영지원팀','부장','2014-05-12','팀장','재직','',3,1],
  [3,'오유진','경영지원팀','과장','2017-09-01','','재직','',1,0],
  [4,'신우재','영업팀','부장','2015-04-01','본부장','재직','',4,2],

const won = n => Math.round(n).toLocaleString('ko-KR');
const pad = (n,l=2) => String(n).padStart(l,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d2 = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmt = dt => dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
const WD = ['일','월','화','수','목','금','토'];
const dayDiff = (a,b) => Math.round((d2(b)-d2(a))/86400000);
/* 아직 입사하지 않은 사람(입사일 > 기준일)을 다루는 두 헬퍼.
   근속이 음수가 되면 근속수당이 마이너스로 계산되므로 0으로 막는다. */
const isFuture = ds => ds > TODAY;
const tenure = e => Math.max(0, yearsBetween(e.join, e.status === '퇴사' && e.leaveDate ? e.leaveDate : TODAY));
const yearsBetween = (from,to) => {
  const f = d2(from), t = d2(to);
  let y = t.getFullYear()-f.getFullYear();
  if (t.getMonth() < f.getMonth() || (t.getMonth()===f.getMonth() && t.getDate()<f.getDate())) y--;
  return y;
};
/* 고정 시드 난수 — 누가 언제 열어도 같은 값이 나오게 함 */
function rng(seed){ let a = seed>>>0; return function(){
  a += 0x6D2B79F5; let t = a; t = Math.imul(t^(t>>>15), t|1); t ^= t + Math.imul(t^(t>>>7), t|61);
  return ((t^(t>>>14))>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }

/* 근태는 두 구간으로 나뉜다 (PRD 규칙 4)
   · 실적 구간 ATT_FROM ~ ATT_TO   : 기준일 직전 근무일까지. 출퇴근·연장·지각·결근 기록이 있다.
   · 예정 구간 ATT_TO ~ ATT_PLAN_TO: 아직 오지 않은 날. 출퇴근 기록은 없고,
                                     승인된 휴가와 공휴일만 보인다.
   급여는 "실적 구간"만 쓴다. 미래의 출퇴근을 지어내면 그게 더 이상하기 때문이다. */
const ATT_FROM = '2026-08-01', ATT_TO = '2026-09-11', ATT_PLAN_TO = '2026-09-30';
let _attCache = null;
function attendance(){
  if (_attCache) return _attCache;
  const rows = [];
  const approvedLeaveDays = {};   // empId|date -> 휴가종류
  S.leaves.filter(l => l.status === '승인').forEach(l => {
    for (let c = d2(l.from); c <= d2(l.to); c.setDate(c.getDate()+1))
      approvedLeaveDays[l.empId + '|' + fmt(c)] = l.type;
  });

  S.employees.forEach(e => {
    const r = rng(hashStr(e.id));
    for (let c = d2(ATT_FROM); c <= d2(ATT_PLAN_TO); c.setDate(c.getDate()+1)) {
      const ds = fmt(c);
      if (!isWorkday(ds)) continue;
      if (ds < e.join) continue;
      if (e.status === '퇴사' && e.leaveDate && ds > e.leaveDate) continue;
      const lv = approvedLeaveDays[e.id + '|' + ds];
      const planned = ds > ATT_TO;          // 아직 오지 않은 날 — 난수를 소비하지 않는다
      let state, inT = '', outT = '', ot = 0;
      if (e.status === '휴직') { state = '휴직'; }
      else if (planned) { state = lv ? '휴가(예정)' : '미입력'; }
      else if (lv) { state = lv.startsWith('반차') ? '반차' : '휴가'; if (state==='반차'){ inT='09:00'; outT='14:00'; } }
      else {
        const p = r();
        if (p < 0.030)      { state = '지각'; inT = '09:' + pad(8 + Math.floor(r()*40)); outT = '18:0' + Math.floor(r()*9); }
        else if (p < 0.045) { state = '조퇴'; inT = '08:5' + Math.floor(r()*9); outT = '1' + (4+Math.floor(r()*3)) + ':30'; }
        else if (p < 0.052) { state = '결근'; }
        else {
          state = '정상';
          inT = '08:' + pad(35 + Math.floor(r()*24));

/* 집계는 실적 구간만 센다 → 급여(연장수당·결근공제)가 미래 날짜에 흔들리지 않는다 */
function attSummary(empId, ym){
  const all  = attendance().filter(a => a.empId === empId && a.date.startsWith(ym));
  const rows = all.filter(a => !a.planned);
  const plan = all.filter(a => a.planned);
  const c = {정상:0, 지각:0, 조퇴:0, 결근:0, 휴가:0, 반차:0, 휴직:0, ot:0,
             days:rows.length, planDays:plan.length, 미입력:0, '휴가(예정)':0};
  rows.forEach(a => { c[a.state]++; c.ot += a.ot; });
  plan.forEach(a => { c[a.state] = (c[a.state] || 0) + 1; });
  return c;
}

   연차 계산 (회계연도 1/1 기준 · 교육용 규칙)
   ===================================================================== */
function annual(e){
  const joinY = Number(e.join.slice(0,4));
  let grant = 0, basis = '';
  if (joinY >= 2026) {
    // 입사 1년 미만: 1개월 개근 시 1일 (최대 11일)
    let m = 0, c = d2(e.join);
    while (true) { c.setMonth(c.getMonth()+1); if (fmt(c) <= TODAY) m++; else break; if (m >= 11) break; }
    grant = m; basis = '입사 1년 미만 → 1개월 개근당 1일 (현재 ' + m + '개월 경과)';
  } else if (joinY === 2025) {
    // 전년도 입사자: 회계연도 비례 부여
    const workedDays = dayDiff(e.join, '2025-12-31') + 1;
    grant = Math.round(15 * workedDays / 365 * 10) / 10;
    basis = '전년도 입사 → 15일 × (2025년 재직 ' + workedDays + '일 ÷ 365) = ' + grant + '일';
  } else {
    const y = yearsBetween(e.join, '2026-01-01');
    grant = Math.min(25, 15 + Math.floor((y-1)/2));
    basis = '근속 ' + y + '년 → 기본 15일 + 가산 ' + Math.max(0, Math.floor((y-1)/2)) + '일 (상한 25일)';
  }
  // 기초 사용분(전산 이관 가상값) + 당기 승인분
  const r = rng(hashStr(e.id + 'annual'));
  const carried = Math.round(r() * grant * 0.55 * 2) / 2;
  const approved = S.leaves
    .filter(l => l.empId === e.id && l.status === '승인' && l.from.startsWith('2026')
                 && (l.type === '연차' || l.type.startsWith('반차')))
    .reduce((s,l) => s + l.days, 0);
  const used = Math.round((carried + approved) * 10) / 10;
  return {grant, basis, carried, approved, used, remain: Math.round((grant - used)*10)/10};
}

/* 간이세액표 조회: 월급여액(원) + 공제대상가족수 → 원천징수 소득세(원) */
function simpleTax(monthly, fam, kids){
  const k = monthly / 1000;                          // 천원 단위
  if (k < TAX_BOUNDS[0]) return {tax:0, table:0, childCut:0, row:null, over:false};
  const over = k >= TAX_BOUNDS[TAX_BOUNDS.length-1]; // 표 상한(9,980천원) 초과분은 별도 산식 구간
  let lo = 0, hi = TAX_ROWS.length - 1, i = hi;
  if (!over) {
    while (lo <= hi) { const m = (lo+hi) >> 1;
      if (k < TAX_BOUNDS[m]) hi = m-1; else if (k >= TAX_BOUNDS[m+1]) lo = m+1; else { i = m; break; } }
  }
  const col = Math.min(11, Math.max(1, fam)) - 1;
  const table = TAX_ROWS[i][col];
  const n = Math.max(0, kids|0);
  const childCut = n === 0 ? 0 : n === 1 ? 20830 : 45830 + Math.max(0, n-2) * 33330;
  return {tax: Math.max(0, table - childCut), table, childCut, over,
          row: {from: TAX_BOUNDS[i], to: TAX_BOUNDS[i+1]}};
}

function payroll(e, ym, ov){
  const base = BASE_PAY[e.grade] || 0;
  const roleP = ROLE_PAY[e.role] || 0;
  const yrs = Math.max(0, yearsBetween(e.join, ym + '-01'));   // 입사 전이면 0 (음수 근속수당 방지)
  const senior = Math.min(300000, yrs * 30000);
  const s = attSummary(e.id, ym);
  const hourly = Math.round(base / 209);
  const overtime = e.status === '재직' ? r10(hourly * 1.5 * s.ot) : 0;
  const absentCut = e.status === '재직' ? r10(base / 30 * s.결근) : 0;
  const onLeave = e.status !== '재직';
  const fam = ov && ov.fam != null ? ov.fam : (e.fam || 1);
  const kids = ov && ov.kids != null ? ov.kids : (e.kids || 0);

  const gross = onLeave ? 0 : (base + roleP + senior + MEAL + overtime - absentCut);
  const taxable = Math.max(0, gross - MEAL);           // 식대 비과세 제외 = 간이세액표의 "월급여액"

  // 국민연금 기준소득월액: 상·하한 적용 후 1천원 미만 절사
  const npBase = Math.floor(Math.min(Math.max(taxable, PENSION_FLOOR), PENSION_CAP) / 1000) * 1000;
  const np  = onLeave ? 0 : r10(npBase * RATE.국민연금);
  const hi  = r10(taxable * RATE.건강보험);
  const ltc = r10(hi * RATE.장기요양);
  const ei  = r10(taxable * RATE.고용보험);
  const st  = simpleTax(taxable, fam, kids);
  const it  = st.tax;
  const lit = r10(it * 0.1);
  const deduct = np + hi + ltc + ei + it + lit;

  return {e, ym, base, roleP, senior, meal: onLeave?0:MEAL, overtime, absentCut, gross, taxable,
          npBase, np, hi, ltc, ei, it, lit, st, fam, kids,
          deduct, net: gross - deduct, otHours: s.ot, absent: s.결근, onLeave, yrs};
}
function payrollAll(ym){ return S.employees.filter(e => e.status !== '퇴사').map(e => payroll(e, ym)); }

function head(title, desc){
  return '<h1>' + esc(title) + ' <span class="badge-v">교육용 가상 자료</span></h1>'
       + '<p class="desc">' + desc + '</p>';
}
function table(cols, rows){
  let h = '<div class="scroll"><table><thead><tr>';
  cols.forEach(c => h += '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.t) + '</th>');
  h += '</tr></thead><tbody>';
  if (!rows.length) h += '<tr><td colspan="' + cols.length + '" style="color:#999;text-align:center;padding:24px">해당 자료가 없습니다.</td></tr>';
  rows.forEach(r => {
    h += '<tr>';
    cols.forEach((c,i) => h += '<td' + (c.num ? ' class="num"' : '') + '>' + (r[i] == null ? '' : r[i]) + '</td>');
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}
function pill(txt){
  const m = {'재직':'p-ok','승인':'p-ok','정상':'p-ok','사용중':'p-ok',
             '퇴사':'p-bad','결근':'p-bad','반려':'p-bad','폐기대기':'p-bad',
             '대기':'p-wait','지각':'p-wait','조퇴':'p-wait','수리중':'p-wait',
             '휴직':'p-off','휴가':'p-off','반차':'p-off','보관중':'p-off','미입력':'p-off',
             '휴가(예정)':'p-plan','예정':'p-plan'};
  return '<span class="pill ' + (m[txt]||'p-off') + '">' + esc(txt) + '</span>';
}
function csv(filename, header, rows){
  const lines = ['# 교육용 가상 자료 - 실제 인사정보 아님 (' + COMPANY + ', 기준일 ' + TODAY + ')'];
  lines.push(header.join(','));
  rows.forEach(r => lines.push(r.map(v => {
    const s = String(v == null ? '' : v).replace(/<[^>]*>/g,'');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* KPI 카드 — design.md의 "피처 카드"를 쓰는 유일한 자리.
   tone 은 색 이름(lavender/peach/ochre/teal/coral/mint), alert 는 문제 상태 테두리.
   design.md는 색을 순환시키라고 하지만, 여기서는 색이 뜻을 갖도록 고정 매핑한다. */
function kpi(l, v, s, tone, alert){
  return '<div class="box' + (tone ? ' t-' + tone : '') + (alert ? ' alert' : '') + '">'
    + '<div class="lbl">' + l + '</div><div class="val">' + v + '</div><div class="sub">' + s + '</div></div>';
}

      ts.sort((a,b) => GRADES.indexOf(b.grade) - GRADES.indexOf(a.grade) || (a.join < b.join ? -1 : 1))
        .forEach(e => h += '<li class="mem">' + esc(e.name) + ' ' + e.grade

};

      h += '<div class="kpi">' + kpi('대상 인원', dayRows.length + '명', day + '(' + WD[d2(day).getDay()] + ')')
        + kpi('휴가(예정)', cnt('휴가(예정)') + '명', '승인된 휴가', 'peach')
        + kpi('미입력', cnt('미입력') + '명', '아직 오지 않은 날')

  ) + '</div>';

VIEWS.annual = function(){
  const list = S.employees.filter(e => e.status !== '퇴사');
  let h = head('연차 관리', '<b>회계연도(매년 1월 1일) 기준</b> 일괄 부여 방식입니다. 각 행의 [근거] 버튼을 누르면 계산 과정을 펼쳐 보여줍니다.');
  h += '<div class="warnbox"><b>교육용 단순화</b> — 실제 연차는 근로기준법 제60조와 회사 취업규칙에 따라 달라집니다. 여기서는 아래 3가지 규칙만 씁니다.<br>'
     + '① 2026년 입사자 → 1개월 개근당 1일(최대 11일) &nbsp; ② 2025년 입사자 → 15일 × 전년 재직일수 비례 &nbsp; ③ 그 이전 입사자 → 15일 + (근속−1)÷2 가산(상한 25일)</div>';

  /* 잔여가 음수인 사원 — 잔여보다 많이 승인해 버린 결과. 눈에 보이게 한다 (PRD 규칙 3) */
  const over = list.filter(e => annual(e).remain < 0);
  if (over.length) h += '<div class="warnbox"><b>잔여 연차가 음수인 사원 ' + over.length + '명</b> — '
    + over.map(e => esc(e.name) + ' <b>' + annual(e).remain + '일</b>').join(', ')
    + '<br>잔여보다 많이 승인된 상태입니다. 실무라면 <b>승인 취소·일부 반려·무급휴가 전환</b> 중 하나를 골라야 합니다.</div>';

  const tot = list.reduce((s,e) => { const a = annual(e); s.g += a.grant; s.u += a.used; s.r += a.remain; return s; }, {g:0,u:0,r:0});
  h += '<div class="kpi">' + kpi('총 발생일수', tot.g.toFixed(1) + '일', list.length + '명 합계')
    + kpi('총 사용일수', tot.u.toFixed(1) + '일', '이관분 + 당기 승인분')
    + kpi('총 잔여일수', tot.r.toFixed(1) + '일', '미사용 연차 부담')
    + kpi('소진율', Math.round(tot.u/tot.g*100) + '%', '연말 집중 사용 방지 지표')
    + (over.length ? kpi('잔여 음수', over.length + '명', '초과 승인 상태', 'coral', true) : '') + '</div>';

  h += '<div class="toolbar"><button class="ghost" onclick="annualCsv()">CSV 내보내기</button></div>';
  h += table(
    [{t:'사번'},{t:'성명'},{t:'팀'},{t:'입사일'},{t:'근속',num:true},{t:'발생',num:true},{t:'이관 사용',num:true},{t:'당기 승인',num:true},{t:'사용 계',num:true},{t:'잔여',num:true},{t:''}],
    list.map(e => { const a = annual(e);
      return [e.id, esc(e.name), e.team, e.join, tenure(e)+'년', a.grant, a.carried, a.approved, a.used,
        a.remain < 0
          ? '<b style="color:var(--bad-fg)">' + a.remain + '</b> <span class="pill p-bad">초과 ' + a.remain + '일</span>'
          : '<b style="color:' + (a.remain < 3 ? '#8a3d00' : 'var(--brand-teal)') + '">' + a.remain + '</b>',
        '<button class="mini ghost" onclick="annualWhy(\''+e.id+'\')">근거</button>']; })
  );
  M().innerHTML = h;
};

    + tr('② 사용', a.used + '일 = 전산 이관분 ' + a.carried + '일 + 당기 승인분 ' + a.approved + '일')

    + table([{t:'기간'},{t:'종류'},{t:'일수',num:true},{t:'사유'}],
        used.map(l => [l.from + (l.from!==l.to ? ' ~ ' + l.to : ''), l.type, l.days, esc(l.reason)]));

VIEWS.leave = function(){
  const tabs = ['전체','대기','승인','반려'];
  const rows = S.leaves.filter(l => UI.leaveTab === '전체' || l.status === UI.leaveTab)
                       .sort((a,b) => a.from < b.from ? 1 : -1);
  let h = head('휴가 신청 · 결재', '신청 → 결재(승인/반려) → 승인 시 <b>연차 잔여일수에서 자동 차감</b>되는 흐름을 따라가 봅니다.');
  h += '<div class="note">실무 포인트 — 승인 전 반드시 <b>잔여일수</b>를 확인합니다. 잔여보다 많이 신청된 건은 이 앱이 경고를 띄웁니다.</div>';
  h += '<div class="toolbar">'
    + tabs.map(t => '<button class="' + (UI.leaveTab===t?'':'ghost') + '" onclick="UI.leaveTab=\''+t+'\';render()">' + t
        + ' (' + (t==='전체' ? S.leaves.length : S.leaves.filter(l=>l.status===t).length) + ')</button>').join(' ')
    + '<button onclick="leaveNew()" style="margin-left:12px">＋ 휴가 신청</button></div>';

  h += table(
    [{t:'No',num:true},{t:'신청자'},{t:'팀'},{t:'종류'},{t:'기간'},{t:'일수',num:true},{t:'신청 사유'},{t:'잔여(신청 전)',num:true},{t:'상태'},{t:'결재'}],
    rows.map(l => {
      const e = emp(l.empId), a = e ? annual(e) : {remain:0};
      const before = l.status === '승인' ? Math.round((a.remain + l.days)*10)/10 : a.remain;
      const over = (l.type === '연차' || l.type.startsWith('반차')) && l.status === '대기' && l.days > a.remain;
      return [l.no, esc(l.name), l.team, l.type,
        l.from + (l.from!==l.to ? ' ~ ' + l.to : ''), l.days, esc(l.reason),
        (over ? '<b style="color:var(--bad-fg)">' + before + ' ⚠</b>' : before),
        pill(l.status),
        l.status === '대기'
          ? '<button class="mini" onclick="leaveAct(' + l.no + ',\'승인\')">승인</button> '
            + '<button class="mini ghost" onclick="leaveAct(' + l.no + ',\'반려\')">반려</button>'
          : '<small class="m">' + (l.decidedBy || '-') + '</small>'];
    })
  );
  M().innerHTML = h;
};
function leaveAct(no, act){
  const l = S.leaves.find(x => x.no === no), e = emp(l.empId), a = annual(e);
  if (act === '승인' && (l.type === '연차' || l.type.startsWith('반차')) && l.days > a.remain) {
    if (!confirm('⚠ 잔여 연차(' + a.remain + '일)보다 신청 일수(' + l.days + '일)가 많습니다.\n실무라면 반려하거나 무급휴가로 전환해야 합니다.\n\n그래도 승인하시겠습니까? (교육용)')) return;
  }
  l.status = act; l.decidedBy = '팀장(실습 결재)';
  save(); render();
  alert(l.name + ' 님의 ' + l.type + ' 신청을 ' + act + ' 처리했습니다.'
    + (act === '승인' ? '\n연차 잔여일수와 근태 현황에 즉시 반영됩니다.' : ''));
}
function leaveNew(){
  const opts = S.employees.filter(e => e.status === '재직')
    .map(e => { const a = annual(e); return '<option value="' + e.id + '">' + e.name + ' (' + e.team + ') · 잔여 ' + a.remain + '일</option>'; }).join('');
  const b = '<label class="f">신청자<select id="lEmp" style="width:260px">' + opts + '</select></label>'
    + '<label class="f">종류<select id="lType"><option>연차</option><option>반차(오전)</option><option>반차(오후)</option><option>병가</option><option>경조사</option></select></label>'
    + '<label class="f">시작일<input id="lFrom" type="date" value="2026-09-21"></label>'
    + '<label class="f">종료일<input id="lTo" type="date" value="2026-09-22"></label>'
    + '<label class="f" style="width:100%;display:flex">사유<input id="lWhy" value="(가상) 개인 사유" style="width:100%"></label>'
    + '<div class="note" style="margin-top:6px">일수는 <b>주말·공휴일을 뺀 실제 근무일</b>로 자동 계산됩니다. 반차는 0.5일입니다.</div>';
  modal('휴가 신청 (가상)', b, () => {
    const id = $('#lEmp').value, e = emp(id), type = $('#lType').value;
    const from = $('#lFrom').value, to = $('#lTo').value;
    if (to < from) { alert('종료일이 시작일보다 빠릅니다.'); return; }
    let days = 0;
    if (type.startsWith('반차')) days = 0.5;
    else for (let c = d2(from); c <= d2(to); c.setDate(c.getDate()+1)) if (isWorkday(fmt(c))) days++;
    if (!days) { alert('선택한 기간에 근무일이 없습니다. (주말·공휴일만 선택됨)'); return; }
    S.leaves.push({no: ++S.seq.leave, empId:id, name:e.name, team:e.team, type,
      from, to: type.startsWith('반차') ? from : to, days, status:'대기',
      reason: $('#lWhy').value, reqDate: TODAY, decidedBy:''});
    save(); closeModal(); UI.leaveTab = '대기'; render();
    alert('신청되었습니다. 근무일 기준 ' + days + '일. (교육용 가상 자료)\n이제 [승인] 또는 [반려]로 결재해 보세요.');
  }, '신청');
}

VIEWS.pay = function(){

    S.stockLogs.slice().reverse().map(l => [l.at, l.code, esc(l.name), l.dir>0?'입고':'출고', l.qty, l.after, esc(l.memo)])) + '</div>';

function stockMove(code, dir){
  const s = S.stock.find(x => x.code === code);
  const b = '<table><tbody>' + tr('품목', s.name + ' (' + s.code + ')')
    + tr('현재고', s.qty + s.unit + ' / 안전재고 ' + s.safe + s.unit) + '</tbody></table>'
    + '<label class="f" style="margin-top:10px">' + (dir>0?'입고':'출고') + ' 수량<input id="mq" type="number" min="1" value="' + (dir>0 ? Math.max(1, s.safe - s.qty + 5) : 1) + '" style="width:100px"></label>'
    + '<label class="f">비고<input id="mm" value="' + (dir>0?'(가상) 정기 발주 입고':'(가상) 부서 불출') + '" style="width:220px"></label>';
  modal((dir>0?'입고':'출고') + ' 처리 (가상)', b, () => {
    const q = Number($('#mq').value);
    if (!q || q < 1) { alert('수량을 확인하세요.'); return; }
    if (dir < 0 && q > s.qty) { alert('현재고(' + s.qty + ')보다 많이 출고할 수 없습니다.'); return; }
    s.qty += dir * q;
    S.stockLogs.push({at: TODAY + ' ' + pad(new Date().getHours()) + ':' + pad(new Date().getMinutes()),
      code:s.code, name:s.name, dir, qty:q, after:s.qty, memo:$('#mm').value});
    save(); closeModal(); render();
  }, '처리');
}
function stockCsv(){
  csv('가상_비품재고_' + TODAY + '.csv', ['코드','품목','분류','단위','현재고','안전재고','부족여부','단가','재고금액','거래처'],
    S.stock.map(s => [s.code,s.name,s.cat,s.unit,s.qty,s.safe,s.qty<s.safe?'부족':'정상',s.price,s.qty*s.price,s.vendor]));
}

VIEWS.room = function(){
  const base = d2(UI.roomDate); base.setDate(base.getDate() - ((base.getDay()+6)%7));  // 주 시작(월)
  const week = []; for (let i=0;i<7;i++){ const c = new Date(base); c.setDate(base.getDate()+i); week.push(fmt(c)); }
  let h = head('회의실 예약', '회의실 ' + S.rooms.length + '곳의 주간 예약 현황입니다. 시간이 겹치는 예약은 <b>등록 단계에서 막힙니다</b>.');
  h += '<div class="toolbar"><label class="f">주간 기준일<input id="rd" type="date" value="' + UI.roomDate + '"></label>'
    + '<button onclick="roomNew()">＋ 예약 등록</button></div>';
  h += '<div class="card"><div class="calgrid">'
    + week.map(d => '<div class="d hd">' + d.slice(5) + '(' + WD[d2(d).getDay()] + ')' + (HOLIDAYS[d] ? '<br><span style="color:#8a3d00">'+HOLIDAYS[d]+'</span>' : '') + '</div>').join('')
    + week.map(d => {
        const bs = S.bookings.filter(b => b.date === d).sort((x,y) => x.start < y.start ? -1 : 1);
        return '<div class="d' + (isWorkday(d) ? '' : ' off') + '"><div class="dn">' + Number(d.slice(8)) + '</div>'
          + bs.map(b => '<div class="ev" title="' + esc(b.title) + '">' + b.start + ' ' + esc(b.room.split('(')[0]) + '</div>').join('') + '</div>';
      }).join('')
    + '</div></div>';
  const wb = S.bookings.filter(b => b.date >= week[0] && b.date <= week[6]).sort((a,b) => (a.date+a.start) < (b.date+b.start) ? -1 : 1);
  h += '<div class="card"><h3>예약 목록</h3>' + table(
    [{t:'일자'},{t:'회의실'},{t:'시간'},{t:'안건'},{t:'예약자'},{t:''}],
    wb.map(b => [b.date + '(' + WD[d2(b.date).getDay()] + ')', b.room, b.start + ' ~ ' + b.end, esc(b.title),
      (emp(b.by)||{}).name || '-', '<button class="mini ghost" onclick="roomDel(' + b.no + ')">취소</button>'])
  ) + '</div>';
  M().innerHTML = h;
  $('#rd').onchange = ev => { UI.roomDate = ev.target.value; render(); };
};
function roomDel(no){
  if (!confirm('예약을 취소할까요? (교육용 가상 자료)')) return;
  S.bookings = S.bookings.filter(b => b.no !== no); save(); render();
}
function roomNew(){
  const b = '<label class="f">회의실<select id="rRoom">' + S.rooms.map(r=>'<option>'+r+'</option>').join('') + '</select></label>'
    + '<label class="f">일자<input id="rDate" type="date" value="' + UI.roomDate + '"></label>'
    + '<label class="f">시작<input id="rS" type="time" value="10:00"></label>'
    + '<label class="f">종료<input id="rE" type="time" value="11:00"></label>'
    + '<label class="f" style="width:100%;display:flex">안건<input id="rT" value="(가상) 회의" style="width:100%"></label>'
    + '<label class="f">예약자<select id="rBy" style="width:240px">'
      + S.employees.filter(e=>e.status==='재직').map(e=>'<option value="'+e.id+'"'+(e.id==='HB-0005'?' selected':'')+'>'+e.name+' ('+e.team+')</option>').join('') + '</select></label>';
  modal('회의실 예약 (가상)', b, () => {
    const room = $('#rRoom').value, date = $('#rDate').value, s = $('#rS').value, e2 = $('#rE').value;
    if (e2 <= s) { alert('종료 시각이 시작 시각보다 빠르거나 같습니다.'); return; }
    const clash = S.bookings.find(x => x.room === room && x.date === date && s < x.end && e2 > x.start);
    if (clash) { alert('예약이 겹칩니다.\n' + clash.room + ' ' + clash.date + ' ' + clash.start + '~' + clash.end + '\n「' + clash.title + '」\n\n다른 시간이나 회의실을 선택하세요.'); return; }
    S.bookings.push({no: ++S.seq.booking, room, date, start:s, end:e2, title:$('#rT').value, by:$('#rBy').value});
    save(); closeModal(); UI.roomDate = date; render();
  }, '예약');
}

function taskState(t){
  if (t.kind === 'do') return t.check();
  const log = S.taskLog[t.id];
  if (!log || log.val == null) return {ok:false, msg:''};
  const correct = t.ans();
  const ok = Math.abs(Number(log.val) - correct) < 0.05;
  return {ok, msg: ok ? '정답입니다.' : '입력값 ' + won(log.val) + ' — 다시 확인해 보세요.'};
}
VIEWS.task = function(){
  const states = TASKS.map(t => ({t, s: taskState(t)}));
  const done = states.filter(x => x.s.ok).length;
  let h = head('실습 과제', TASKS.length + '개 과제입니다. 화면에서 직접 처리하면 자동으로 채점됩니다. 모든 데이터는 가상이니 마음 놓고 눌러 보세요.');
  h += '<div class="card"><div style="display:flex;align-items:center;gap:12px">'
    + '<b style="font-size:16px">진도 ' + done + ' / ' + TASKS.length + '</b>'
    + '<div style="flex:1;height:12px;background:var(--surface-strong);border-radius:6px;overflow:hidden">'
    + '<div style="width:' + Math.round(done/TASKS.length*100) + '%;height:100%;background:var(--brand-teal)"></div></div>'
    + '<span style="color:var(--muted);font-size:12px">' + Math.round(done/TASKS.length*100) + '%</span>'
    + '<button class="ghost" onclick="taskClear()">답안 지우기</button></div></div>';

  states.forEach(({t, s}, i) => {
    h += '<div class="task' + (s.ok ? ' done' : '') + '">'
      + '<h4>' + (s.ok ? '✅ ' : '☐ ') + '과제 ' + (i+1) + '. <span style="color:var(--brand-teal)">[' + t.mod + ']</span></h4>'
      + '<div class="q">' + t.q + '</div>';
    if (t.kind === 'num') {
      const log = S.taskLog[t.id] || {};
      h += '<input id="ta_' + t.id + '" value="' + (log.val != null ? log.val : '') + '" placeholder="답 입력" style="width:140px"> '
         + '<span style="color:var(--muted);font-size:12px">' + (t.unit||'') + '</span> '
         + '<button class="mini" onclick="taskAns(\'' + t.id + '\')">제출</button> ';
    }
    h += '<button class="mini ghost" onclick="go(\'' + t.view + '\')">해당 화면 열기</button> '
       + '<button class="mini ghost" onclick="taskHint(\'' + t.id + '\')">힌트</button>';
    if (s.msg) h += '<div class="res" style="color:' + (s.ok ? 'var(--ok-fg)' : '#8a3d00') + '">' + (s.ok ? '✔ ' : '· ') + esc(s.msg) + '</div>';
    h += '</div>';
  });
  h += '<div class="note">채점 기준은 이 앱 안의 현재 데이터입니다. 다른 실습으로 데이터가 바뀌면 정답도 함께 바뀝니다 — 실제 인사 업무도 그렇습니다.</div>';
  M().innerHTML = h;
};
function taskHint(id){
  const t = TASKS.find(x => x.id === id);
  modal('힌트 — ' + t.mod, '<div class="note" style="margin:0">' + t.hint + '</div>');
}
function taskAns(id){
  const v = $('#ta_' + id).value.replace(/[,\s원명일]/g,'');
  if (v === '' || isNaN(Number(v))) { alert('숫자로 입력하세요.'); return; }
  S.taskLog[id] = {val: Number(v)};
  save(); render();
}
function taskClear(){
  if (!confirm('제출한 답안만 지웁니다. 실습으로 입력한 데이터는 그대로 둡니다. 진행할까요?')) return;
  S.taskLog = {}; save(); render();
}

VIEWS.ai = function(){

  h += '<div class="warnbox"><b>이 화면은 연결 확인용입니다.</b> 실제 인사·급여 데이터는 AI 로 보내지 않습니다. '

  } else if (AI.status.keyConfigured) {
    h += '<div class="res">✔ API 키가 서버에 설정돼 있습니다 (길이 ' + AI.status.keyLength + '자 · 값은 브라우저로 내려오지 않음)<br>'
       + '사용 모델: <b>' + esc(AI.status.model) + '</b></div>';
  } else {
    h += '<div class="res" style="color:#8a3d00">· API 키가 없습니다.<br>' + esc(AI.status.message || '') + '</div>';
  }
  h += '<div style="margin-top:10px"><button class="mini ghost" onclick="aiCheck()">연결 상태 확인</button></div>';
  h += '</div>';

  /* ── 실제 호출 카드 ── */
  h += '<div class="card"><h3>2단계 · 실제로 물어보기</h3>';
  h += '<div style="margin-bottom:10px">'
     + AI_PRESETS.map((p,i) => '<button class="mini ghost" onclick="aiPreset(' + i + ')">' + esc(p.label) + '</button> ').join('')
     + '</div>';
  h += '<textarea id="aiq" rows="4" style="width:100%;font:inherit;padding:10px;border:1px solid var(--hairline);'
     + 'border-radius:8px;resize:vertical" placeholder="AI 에게 물어볼 내용을 입력하세요">' + esc(AI.prompt) + '</textarea>';
  h += '<div style="margin-top:10px">'
     + '<button id="aiGo"' + (AI.busy ? ' disabled' : '') + '>' + (AI.busy ? '물어보는 중…' : 'AI 에게 보내기') + '</button> '
     + '<button class="mini ghost" onclick="aiClear()">결과 지우기</button>'
     + '</div>';

  if (AI.error) {
    h += '<div class="res" style="color:#8a3d00;margin-top:12px"><b>실패</b> — ' + esc(AI.error) + '</div>';
  }
  if (AI.result) {
    h += '<div class="res" style="margin-top:12px"><b>✔ 성공</b> · 응답시간 ' + AI.ms + 'ms</div>'
       + '<div class="card" style="margin-top:10px;background:var(--surface-soft)">'
       + '<div style="white-space:pre-wrap;line-height:1.7">' + esc(AI.result) + '</div></div>';
  }
  h += '</div>';

  h += '<div class="note">키는 <b>Vercel 환경변수</b>에만 저장됩니다. 이 앱의 HTML 과 GitHub 저장소 어디에도 키가 들어 있지 않습니다.</div>';

  M().innerHTML = h;

  const q = $('#aiq');
  if (q) q.oninput = ev => { AI.prompt = ev.target.value; };
  const btn = $('#aiGo');
  if (btn) btn.onclick = aiAsk;
};

function aiPreset(i){ AI.prompt = AI_PRESETS[i].text; render(); }
function aiClear(){ AI.result = null; AI.error = null; AI.ms = 0; render(); }

async function aiCheck(){
  AI.error = null;
  try {
    const r = await fetch('/api/gemini');
    AI.status = await r.json();
  } catch (e) {
    AI.status = { offline: true };
  }
  render();
}

async function aiAsk(){
  const prompt = (AI.prompt || '').trim();
  if (!prompt) { alert('물어볼 내용을 입력하세요.'); return; }

  AI.busy = true; AI.error = null; AI.result = null; render();
  const t0 = Date.now();
  try {
    const r = await fetch('/api/gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt }),
    });
    const d = await r.json().catch(() => null);
    if (!d) {
      AI.error = '서버 응답을 읽지 못했습니다 (HTTP ' + r.status + ').';
    } else if (d.ok) {
      AI.result = d.text; AI.ms = d.ms || (Date.now() - t0);
    } else {
      AI.error = (d.error || '알 수 없는 오류') + (d.hint ? ' — ' + d.hint : '');
    }
  } catch (e) {
    AI.error = '서버 함수(/api/gemini)에 닿지 못했습니다. 파일을 그냥 열었다면 정상입니다 — '
             + 'Vercel 배포 주소에서 열거나 `vercel dev` 로 실행해야 AI 기능이 동작합니다.';
  } finally {
    AI.busy = false; render();
  }
}

/* ===================================================================== */
load();
render();

</script>
